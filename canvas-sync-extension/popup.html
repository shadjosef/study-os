<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study-OS Sync</title>
<style>
  :root {
    color-scheme: light dark;
    font: 13.5px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --bg: #f5f7f8;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: rgba(15, 23, 42, 0.10);
    --accent: #0f766e;
    --good: #15803d;
    --bad: #be123c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --card: #171f27;
      --ink: #f1f5f9;
      --muted: #94a3b8;
      --line: rgba(255, 255, 255, 0.11);
      --accent: #10b981;
      --good: #34d399;
      --bad: #fb7185;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 344px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--ink);
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
  }
  h1 {
    font-size: 15px;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
  }
  .pill.live {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 10px;
  }
  p { margin: 0; line-height: 1.45; }
  .muted { color: var(--muted); font-size: 12px; }
  .tabs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .tab-chip {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    text-decoration: none;
    padding: 8px 9px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
  }
  .tab-chip.detected {
    border-color: color-mix(in srgb, var(--accent) 52%, var(--line));
    background: color-mix(in srgb, var(--accent) 9%, var(--card));
  }
  .tab-chip-sub {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
  }
  .tab-chip.detected .tab-chip-sub {
    color: var(--accent);
    font-weight: 650;
  }
  .results-list {
    margin: 8px 0 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 5px;
    font-size: 12px;
  }
  .results-list li {
    padding: 6px 8px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    line-height: 1.4;
  }
  .results-list li.ok { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
  .results-list li.err { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); color: var(--bad); }
  label.field { display: grid; gap: 5px; font-weight: 600; font-size: 12.5px; }
  input[type="text"] {
    width: 100%;
    padding: 9px 11px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 600 14px ui-monospace, SFMono-Regular, monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    cursor: pointer;
  }
  .check-row input { margin-top: 2px; }
  .btn {
    width: 100%;
    padding: 9px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    font: 600 13.5px inherit;
    cursor: pointer;
    margin-top: 10px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
  }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .foot a, .foot button {
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    font: 600 12px inherit;
    cursor: pointer;
    text-decoration: none;
  }
  [hidden] { display: none !important; }
</style>
<body>
  <div class="head">
    <div class="brand">
      <span class="dot"></span>
      <h1>Study-OS Sync</h1>
    </div>
    <span class="pill" id="site-pill">Checking…</span>
  </div>

  <div class="tabs-grid" id="tabs-grid">
    <a class="tab-chip" id="chip-canvas" href="https://canvas.bi.no/" target="_blank" rel="noopener">
      <span>BI Canvas</span>
      <span class="tab-chip-sub">Open tab ↗</span>
    </a>
    <a class="tab-chip" id="chip-timeedit" href="https://cloud.timeedit.net/bi/web/public/" target="_blank" rel="noopener">
      <span>TimeEdit</span>
      <span class="tab-chip-sub">Open tab ↗</span>
    </a>
    <a class="tab-chip" id="chip-ed" href="https://eu.edstem.org/" target="_blank" rel="noopener">
      <span>Ed</span>
      <span class="tab-chip-sub">Open tab ↗</span>
    </a>
  </div>

  <div class="card">
    <p id="status" role="status">Checking your open tabs…</p>
    <ul class="results-list" id="results-list" hidden></ul>

    <form id="pair" hidden style="margin-top:10px">
      <label class="field">6-character pairing code (from studyos.no)
        <input id="code" type="text" required minlength="6" maxlength="64" placeholder="K7M-9P2" autocomplete="off" spellcheck="false">
      </label>
      <p class="muted" style="margin-top:5px">On <b>studyos.no</b>, click <b>Sync BI</b> and generate a 6-character code.</p>
      <button type="submit" class="btn btn-primary">Connect to Study-OS</button>
    </form>

    <label class="check-row" id="share-wrap" hidden>
      <input type="checkbox" id="share-public" checked>
      <span>
        <b>Share course catalog to Community</b><br>
        <span class="muted">Merges course codes &amp; module titles without duplicating. Deadlines &amp; TimeEdit stay private.</span>
      </span>
    </label>

    <button type="button" class="btn btn-primary" id="sync-btn" hidden>Sync all open tabs</button>
  </div>

  <div class="foot">
    <a href="https://studyos.no/" target="_blank" rel="noopener">Open studyos.no ↗</a>
    <button type="button" id="disconnect-btn" hidden>Disconnect</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
