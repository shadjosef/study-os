name: Deploy Study-OS Static Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app/public/**
      - app/*.py
      - canvas-sync-extension/**
      - examples/**
      - site-pack/**
      - tools/build_public_site.py
      - tools/geo_markdown.py
      - tools/seo_pages.py
      - tools/seo_audit.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PdfCraft Web WASM release
        if: hashFiles('site-pack/pdfcraft-web.json') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/studyos-pdfcraft
          key: pdfcraft-web-${{ hashFiles('site-pack/pdfcraft-web.json') }}

      - name: Build static web bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=()
          if [ -f site-pack/member-archive.json ]; then
            tag=$(python3 -c 'import json; print(json.load(open("site-pack/member-archive.json"))["tag"])')
            gh release download "$tag" --pattern study-os-members.zip --dir "$RUNNER_TEMP"
            EXTRA_ARGS+=(--member-archive "$RUNNER_TEMP/study-os-members.zip")
          fi
          if [ -f site-pack/pdfcraft-web.json ]; then
            mkdir -p "$HOME/.cache/studyos-pdfcraft"
            PDFCRAFT_ASSET=$(python3 -c 'import json; print(json.load(open("site-pack/pdfcraft-web.json"))["asset"])')
            PDFCRAFT_URL=$(python3 -c 'import json; print(json.load(open("site-pack/pdfcraft-web.json"))["url"])')
            PDFCRAFT_ZIP="$HOME/.cache/studyos-pdfcraft/$PDFCRAFT_ASSET"
            if [ ! -f "$PDFCRAFT_ZIP" ]; then
              curl -fsSL "$PDFCRAFT_URL" -o "${PDFCRAFT_ZIP}.part"
              mv "${PDFCRAFT_ZIP}.part" "$PDFCRAFT_ZIP"
            fi
            EXTRA_ARGS+=(--pdfcraft-archive "$PDFCRAFT_ZIP")
          fi
          python3 tools/build_public_site.py --out ./dist "${EXTRA_ARGS[@]}"
          python3 tools/seo_audit.py --dir ./dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow (Bing, DuckDuckGo & AI search)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, xml.etree.ElementTree as ET
          ua = {"User-Agent": "Study-OS-Deploy/1.0"}
          req = urllib.request.Request("https://studyos.no/sitemap.xml", headers=ua)
          with urllib.request.urlopen(req, timeout=15) as r:
              sm = ET.fromstring(r.read().decode("utf-8"))
          urls = [el.text for el in sm.findall(".//{http://www.sitemaps.org/schemas/sitemap/0.9}loc") if el.text]
          key = "7d4c9e2a8b1f4063a5e7c2d9f1b84e60"
          body = json.dumps({
              "host": "studyos.no",
              "key": key,
              "keyLocation": f"https://studyos.no/{key}.txt",
              "urlList": urls,
          }).encode("utf-8")
          post = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=body,
              headers={"Content-Type": "application/json; charset=utf-8", **ua},
              method="POST",
          )
          with urllib.request.urlopen(post, timeout=15) as resp:
              print(f"IndexNow HTTP {resp.status} ({len(urls)} URLs)")
          PY
