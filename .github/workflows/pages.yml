name: Deploy Study-OS Static Hub to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - app/public/**
      - app/*.py
      - examples/**
      - site-pack/**
      - tools/build_public_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static web bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f site-pack/member-archive.json ]; then
            tag=$(python3 -c 'import json; print(json.load(open("site-pack/member-archive.json"))["tag"])')
            gh release download "$tag" --pattern study-os-members.zip --dir "$RUNNER_TEMP"
            python3 tools/build_public_site.py --out ./dist --member-archive "$RUNNER_TEMP/study-os-members.zip"
          else
            python3 tools/build_public_site.py --out ./dist
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
