name: Study-OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Python stdlib bytecode & warning check
        run: |
          python3 -Werror -m py_compile \
            app/*.py \
            tools/*.py \
            tools/study-os-vscode/build_vsix.py

      - name: Run Python unit tests
        run: |
          if [ -d tests/python ]; then
            python3 -m unittest discover -s tests/python -v
          else
            echo "No tests/python directory yet; skipping."
          fi

      - name: Frontend, Worker, Chrome, VS Code & Obsidian JS syntax check
        run: |
          for f in \
            app/public/js/*.js \
            app/public/js/core/*.js \
            app/public/offline-worker.js \
            canvas-sync-extension/*.js \
            community/*.mjs \
            tools/study-os-vscode/*.js \
            tools/smoke_test_e2e.mjs \
            obsidian-plugin/main.js; do
            node --check "$f"
          done

      - name: JSDoc TypeScript check (jsconfig.json)
        run: |
          mkdir -p /tmp/pw-ci
          npm --prefix /tmp/pw-ci install --no-save typescript@latest playwright-core@latest
          /tmp/pw-ci/node_modules/.bin/tsc --noEmit -p jsconfig.json

      - name: Run Node unit tests
        run: |
          mapfile -t test_files < <(find tests -name '*.test.mjs' -type f | sort)
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No *.test.mjs test files found under tests/" >&2
            exit 1
          fi
          node --test "${test_files[@]}"

      - name: Validate Chrome extension manifest & VS Code .vsix XML
        run: |
          python3 - <<'PY'
          import json, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path

          m = json.loads(Path("canvas-sync-extension/manifest.json").read_text(encoding="utf-8"))
          assert m["manifest_version"] == 3, "Chrome extension must be Manifest V3"
          assert len(m["description"]) <= 132, f"CWS description exceeds 132 chars: {len(m['description'])}"

          vsix = Path("app/public/downloads/study-os-companion.vsix")
          with zipfile.ZipFile(vsix) as zf:
              ET.fromstring(zf.read("[Content_Types].xml"))
              ET.fromstring(zf.read("extension.vsixmanifest"))
              assert "extension/icon.png" in zf.namelist(), "VSIX missing icon.png"
              assert "extension/LICENSE" in zf.namelist(), "VSIX missing LICENSE"
          print(f"Extensions verified: Chrome Sync v{m['version']} & VS Code Companion VSIX XML OK")
          PY

      - name: Build static site & run SEO/GEO audit
        run: |
          python3 tools/build_public_site.py --out /tmp/study-os-ci-dist
          python3 tools/seo_audit.py --dir /tmp/study-os-ci-dist

      - name: Headless Chromium E2E smoke test
        run: |
          if [ ! -d /tmp/pw-ci/node_modules/playwright-core ]; then
            mkdir -p /tmp/pw-ci
            npm --prefix /tmp/pw-ci install --no-save playwright-core@latest
          fi
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            /tmp/pw-ci/node_modules/.bin/playwright-core install chromium
          fi
          PLAYWRIGHT_MODULE=/tmp/pw-ci/node_modules/playwright-core node tools/smoke_test_e2e.mjs /tmp/study-os-ci-dist

      - name: Fresh-clone CLI & HTTP smoke test (zero data/)
        run: |
          python3 tools/cli.py status > /dev/null
          python3 tools/cli.py rebuild-catalog
          python3 app/server.py --port 18765 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18765/api/ping > /dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18765/api/ping | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:18765/api/bootstrap | grep -q '"catalog"'
