name: Study-OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python stdlib bytecode & warning check
        run: |
          python3 -Werror -m py_compile \
            app/server.py \
            app/analytics.py \
            app/calendar_sync.py \
            app/canvas_bridge.py \
            app/canvas_browser.py \
            app/timetable_planner.py \
            app/obsidian_sync.py \
            app/dlpfc.py \
            app/tutor_bridge.py \
            tools/cli.py \
            tools/build_public_site.py \
            tools/build_member_library.py \
            tools/study_os_mcp.py

      - name: Frontend & Obsidian plugin JS syntax check
        run: |
          node --check app/public/js/render.js
          node --check app/public/js/local-sources.js
          node --check app/public/js/layouts.js
          node --check app/public/js/runner.js
          node --check app/public/js/pdf-reader.js
          node --check app/public/js/question-copy.js
          node --check app/public/js/study-tutor.js
          node --check app/public/js/tutor-bridge.js
          node --check app/public/js/rooms.js
          node --check app/public/js/app.js
          node --check app/public/js/canvas-connect.js
          node --check app/public/js/schedule-tools.js
          node --check canvas-sync-extension/background.js
          node --check canvas-sync-extension/popup.js
          node --check canvas-sync-extension/studyos-bridge.js
          node --check app/public/js/members.js
          node --check app/public/js/study-sets.js
          node --check app/public/js/community.js
          node --check app/public/js/ai-tutor.js
          node --check app/public/js/playbook.js
          node --check community/worker.mjs
          node --check community/ai.mjs
          node --check community/rooms.mjs
          node --check community/admin.mjs
          node --check community/auth.mjs
          node --check community/courses.mjs
          node --check community/human.mjs
          node --check community/timeedit.mjs
          node --check community/sync.mjs
          node --check obsidian-plugin/main.js

      - name: Fresh-clone CLI & HTTP smoke test (zero data/)
        run: |
          python3 tools/cli.py status > /dev/null
          python3 tools/cli.py rebuild-catalog
          python3 app/server.py --port 18765 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:18765/api/ping > /dev/null 2>&1; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:18765/api/ping | grep -q '"ok": true'
          curl -fsS http://127.0.0.1:18765/api/bootstrap | grep -q '"catalog"'
